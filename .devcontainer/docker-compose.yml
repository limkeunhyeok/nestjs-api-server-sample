version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-root}:${DB_PASS:-password}@db:5432/${DB_NAME:-mydb}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${DB_USER:-root}
      - PGPASSWORD=${DB_PASS:-password}
      - PGDATABASE=${DB_NAME:-mydb}
      - PORT=${PORT:-3000}
      - TYPESCRIPT_VERSION=5.9.3
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      - db
    networks:
      - devnet

  db:
    image: postgres:18
    restart: unless-stopped
    command: >
      postgres
      -c logging_collector=on
      -c log_destination=stderr
      -c log_directory=/var/log/postgresql
      -c log_filename=postgresql.log
      -c log_statement=all
      -c log_min_duration_statement=500
    volumes:
      - postgres-data:/var/lib/postgresql
      - postgres-logs:/var/log/postgresql
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_USER:-root}
      - POSTGRES_PASSWORD=${DB_PASS:-password}
      - POSTGRES_DB=${DB_NAME:-mydb}
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - devnet

  pgadmin:
    image: dpage/pgadmin4:9.9.0
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-password}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - devnet

  redis:
    container_name: my-redis
    image: redis:8.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - devnet

  minio:
    container_name: my-minio
    image: minio/minio:latest
    ports:
      - '${MINIO_PORT}:${MINIO_PORT}' # API
      - '${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}' # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - devnet

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false # 테스트를 위해 보안 해제
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'
    networks:
      - devnet

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    container_name: kibana
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch
    networks:
      - devnet

  fluent-bit:
    image: fluent/fluent-bit:4.2.2
    container_name: fluent-bit
    ports:
      - '24224:24224'
      - '24224:24224/udp'
    volumes:
      - ../fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ../fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - postgres-logs:/var/log/postgresql:ro
    depends_on:
      - elasticsearch
    networks:
      - devnet

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  minio-data:
  postgres-logs:
  es-data:

networks:
  devnet:
