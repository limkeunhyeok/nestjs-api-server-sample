version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../:/workspace:cached
    command: sleep infinity
    env_file:
      - ./.env
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-root}:${DB_PASS:-password}@db:5432/${DB_NAME:-mydb}
      - PGHOST=db
      - PGPORT=5432
      - PGUSER=${DB_USER:-root}
      - PGPASSWORD=${DB_PASS:-password}
      - PGDATABASE=${DB_NAME:-mydb}
      - PORT=${PORT:-3000}
      - TYPESCRIPT_VERSION=5.9.3
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    depends_on:
      - db
    networks:
      - devnet

  db:
    image: postgres:18
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_USER:-root}
      - POSTGRES_PASSWORD=${DB_PASS:-password}
      - POSTGRES_DB=${DB_NAME:-mydb}
    ports:
      - '${DB_PORT:-5432}:5432'
    networks:
      - devnet

  pgadmin:
    image: dpage/pgadmin4:9.9.0
    restart: unless-stopped
    env_file:
      - ./.env
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@example.com}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-password}
      - PGADMIN_CONFIG_SERVER_MODE=False
      - PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED=False
    ports:
      - '${PGADMIN_PORT:-5050}:80'
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      - db
    networks:
      - devnet

  redis:
    container_name: redis
    image: redis:8.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - devnet

  minio:
    container_name: minio
    image: minio/minio:latest
    ports:
      - '${MINIO_PORT}:${MINIO_PORT}' # API
      - '${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}' # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio-data:/data
    restart: unless-stopped
    networks:
      - devnet

volumes:
  postgres-data:
  pgadmin-data:
  redis-data:
  minio-data:

networks:
  devnet:
