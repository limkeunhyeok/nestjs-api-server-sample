name: pr check

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Checking lint
        run: pnpm run lint

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Checking build
        run: pnpm run build

  test-e2e:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      SALT_ROUND: 10
      ACCESS_TOKEN_SECRET: test_access_token
      REFRESH_TOKEN_SECRET: test_refresh_token
      REDIS_PASSWORD: test_redis_password
      JWT_PRIVATE_JWK: '{"kty":"EC","d":"kN45xM9XmZ9GjJ3_T_G55jJ56_t_45_x_23_y","crv":"P-256","x":"dummy_x","y":"dummy_y","alg":"ES256","kid":"test","use":"sig"}'
      JWT_PUBLIC_JWK: '{"kty":"EC","crv":"P-256","x":"dummy_x","y":"dummy_y","alg":"ES256","kid":"test","use":"sig"}'
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run E2E Tests
        run: pnpm run test:e2e
