name: pr check

on:
  pull_request:
  push:
    branches:
      - develop

jobs:
  lint:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Checking lint
        run: pnpm run lint

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Checking build
        run: pnpm run build

  test-e2e:
    runs-on: ubuntu-latest
    env:
      PORT: 3000
      SALT_ROUND: 10
      ACCESS_TOKEN_SECRET: test_access_token
      REFRESH_TOKEN_SECRET: test_refresh_token
      REDIS_PASSWORD: test_redis_password
      JWT_PRIVATE_JWK: '{"kty":"EC","x":"XMurRBkAiCnflVNVJ1Qr87V5x8CgKpeLiPhP1DHuPrs","y":"LFGRQY3xHXNwYYl5WujJq8lY57EIrNfkP-ZsHV93BJ0","crv":"P-256","d":"fgDcr-S-IzAYvhU04QwgzgmlLhmFH5Qp3tw5jX50W0A","alg":"ES256","kid":"88f9c6d1-627d-4de0-9889-8b8fc3263f29","use":"sig"}'
      JWT_PUBLIC_JWK: '{"kty":"EC","x":"XMurRBkAiCnflVNVJ1Qr87V5x8CgKpeLiPhP1DHuPrs","y":"LFGRQY3xHXNwYYl5WujJq8lY57EIrNfkP-ZsHV93BJ0","crv":"P-256","alg":"ES256","kid":"88f9c6d1-627d-4de0-9889-8b8fc3263f29","use":"sig"}'
    strategy:
      matrix:
        node-version: [24.x]
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Common Setup
        uses: ./.github/actions/common-setup
        with:
          node-version: ${{ matrix.node-version }}

      - name: Run E2E Tests
        run: pnpm run test:e2e
