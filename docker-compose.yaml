version: '3.8'

networks:
  server-prod:

services:
  server:
    container_name: api
    build:
      context: .
      dockerfile: ./Dockerfile
    env_file:
      - ./.env
    expose:
      - ${PORT:-3000}
    ports:
      - '${PORT:-3000}:${PORT:-3000}'
    restart: unless-stopped
    networks:
      - server-prod
    depends_on:
      - postgres

  postgres:
    container_name: postgres
    image: postgres:18
    env_file:
      - ./.env
    environment:
      - POSTGRES_USER=${DB_USER:-root}
      - POSTGRES_PASSWORD=${DB_PASS:-password}
      - POSTGRES_DB=${DB_NAME:-mydb}
    volumes:
      - postgres-data:/var/lib/postgresql
    expose:
      - ${DB_PORT:-5432}
    ports:
      - '${DB_PORT:-5432}:5432'
    restart: unless-stopped
    networks:
      - server-prod

  redis:
    container_name: redis
    image: redis:8.4-alpine
    command: redis-server --requirepass ${REDIS_PASSWORD} --appendonly yes
    ports:
      - '${REDIS_PORT}:${REDIS_PORT}'
    volumes:
      - redis-data:/data
    restart: unless-stopped
    networks:
      - server-prod

  minio:
    container_name: minio
    image: minio/minio:latest
    ports:
      - '${MINIO_PORT}:${MINIO_PORT}' # API
      - '${MINIO_CONSOLE_PORT}:${MINIO_CONSOLE_PORT}' # Console
    environment:
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    command: server /data --console-address ":${MINIO_CONSOLE_PORT}"
    volumes:
      - minio-data:/data
    restart: unless-stopped

  backup:
    container_name: postgres-backup
    build:
      context: .
      dockerfile: ./Dockerfile.backup
    depends_on:
      - postgres
      - minio
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
      PGPASSWORD: ${POSTGRES_PASS}
      MINIO_ROOT_USER: ${MINIO_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_PASSWORD:-minioadmin}
    restart: 'no'

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.3
    container_name: elasticsearch
    environment:
      - node.name=es01
      - cluster.name=es-docker-cluster
      - discovery.type=single-node
      - xpack.security.enabled=false # 테스트를 위해 보안 해제
      - 'ES_JAVA_OPTS=-Xms512m -Xmx512m'
    ports:
      - '9200:9200'

  kibana:
    image: docker.elastic.co/kibana/kibana:9.2.3
    container_name: kibana
    ports:
      - '5601:5601'
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
    depends_on:
      - elasticsearch

  fluent-bit:
    image: fluent/fluent-bit:4.2.2
    container_name: fluent-bit
    ports:
      - '24224:24224'
      - '24224:24224/udp'
    volumes:
      - ./fluent-bit/fluent-bit.conf:/fluent-bit/etc/fluent-bit.conf
      - ./fluent-bit/parsers.conf:/fluent-bit/etc/parsers.conf
      - postgres-logs:/var/log/postgresql:ro
    depends_on:
      - elasticsearch

  jenkins:
    build:
      context: .
      dockerfile: Dockerfile.jenkins
    container_name: jenkins
    user: root
    privileged: true
    ports:
      - '8080:8080'
      - '50000:50000'
    volumes:
      - ./jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
    restart: unless-stopped
    environment:
      - TZ=Asia/Seoul
    # docker exec jenkins cat /var/jenkins_home/secrets/initialAdminPassword

volumes:
  minio-data:
  redis-data:
  postgres-data:
  postgres-logs:
  es-data:
