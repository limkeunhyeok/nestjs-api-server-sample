[SERVICE]
    Flush        1
    Daemon       Off
    Log_Level    info
    Parsers_File parsers.conf

# --- INPUTS ---

# NestJS 로그 수집 (TCP Forward)
[INPUT]
    Name             forward
    Listen           0.0.0.0
    Port             24224

# Postgres 로그 수집 (파일 Tail)
[INPUT]
    Name              tail
    Tag               postgres.logs
    Path              /var/log/postgresql/postgresql.log
    DB                /fluent-bit/etc/postgres_log.db
    Parser            postgres_line
    Mem_Buf_Limit     5MB
    Skip_Long_Lines   On

# --- FILTERS ---

# NestJS 로그 파싱 (태그가 nestjs로 시작하는 것만)
[FILTER]
    Name             parser
    Match            nestjs.*
    Key_Name         log
    Parser           json
    Preserve_Key     On

# Postgres 로그에 서비스 이름 추가
[FILTER]
    Name              modify
    Match             postgres.logs
    Add               service_name postgres

# --- OUTPUTS ---

# NestJS 로그 전용 출력
[OUTPUT]
    Name            es
    Match           nestjs.*
    Host            elasticsearch
    Port            9200
    Index           nestjs-logs
    Suppress_Type_Name   On
    Logstash_Format On
    Logstash_Prefix nestjs
    Replace_Dots    On
    Retry_Limit     False

# Postgres 로그 전용 출력
[OUTPUT]
    Name            es
    Match           postgres.logs
    Host            elasticsearch
    Port            9200
    Index           postgres-logs
    Suppress_Type_Name On
    Logstash_Format On
    Logstash_Prefix pg-logs
    Replace_Dots    On