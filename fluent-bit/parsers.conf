[PARSER]
    Name        json
    Format      json
    Time_Key    timestamp
    Time_Format %Y-%m-%dT%H:%M:%S.%L


[PARSER]
    Name        postgres_line
    Format      regex
    # 예시 로그: 2025-12-18 05:37:14.635 UTC [116] LOG: statement: SELECT ...
    Regex       /^(?<time>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2}\.\d{3} \w+) \[(?<pid>\d+)\] (?<level>\w+):  (?<message>.*)$/
    Time_Key    time
    Time_Format %Y-%m-%d %H:%M:%S.%L %Z